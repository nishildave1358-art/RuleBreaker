name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --nologo

      - name: Test
        run: dotnet test --nologo

      # Validates every rule file individually, then lints the whole pool
      # (30/25/15/15/10/5 distribution, copy rules, depth gating, memory
      # coverage, resolvability). bash because only it expands the glob before
      # the paths reach the CLI.
      - name: Lint the 100-rule library
        shell: bash
        run: dotnet run --project tools/RuleBreaker.Tools.LevelValidator -- --library data/rules/*.json
